name: 📥 Download DTS & Push ke Repository

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  download-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: ⚙️ Setup
      run: |
        sudo apt-get update -y
        sudo apt-get install -y wget

    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # ============================================
    # DOWNLOAD DTS
    # ============================================
    - name: 📄 Download DTS
      run: |
        echo "📥 Downloading DTS files for Samsung J5..."
        
        # Buat direktori
        DTS_DIR="target/linux/msm89xx/dts-6.18/arch/arm64/boot/dts/qcom"
        mkdir -p "$DTS_DIR"
        
        DT_DIR="target/linux/msm89xx/dts-6.18/include/dt-bindings"
        mkdir -p "$DT_DIR"
        mkdir -p "$DT_DIR/sound"
        
        # ==========================================
        # DOWNLOAD DTS
        # ==========================================
        echo ""
        echo "📥 Downloading DTS files..."
        
        cd "$DTS_DIR"
        wget -q https://raw.githubusercontent.com/torvalds/linux/master/arch/arm64/boot/dts/qcom/msm8916-samsung-j5.dts
        wget -q https://raw.githubusercontent.com/torvalds/linux/master/arch/arm64/boot/dts/qcom/msm8916-samsung-j5-common.dtsi
        cd -
        
        # ==========================================
        # DOWNLOAD BINDINGS
        # ==========================================
        echo ""
        echo "📥 Downloading DT bindings..."
        
        cd "$DT_DIR"
        wget -q https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/gpio/gpio.h
        wget -q https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/clock/qcom,gcc-msm8916.h
        wget -q https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/clock/qcom,rpmcc.h
        wget -q https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/interrupt-controller/irq.h
        wget -q https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/power/qcom-rpmpd.h
        cd -
        
        # ==========================================
        # SOUND BINDINGS
        # ==========================================
        echo ""
        echo "📥 Downloading sound bindings..."
        
        cd "$DT_DIR/sound"
        wget -q https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/sound/qcom,q6afe.h 2>/dev/null || echo "/* dummy for q6afe */" > qcom,q6afe.h
        wget -q https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/sound/qcom,q6asm.h 2>/dev/null || echo "/* dummy for q6asm */" > qcom,q6asm.h
        echo "/* dummy for q6adm */" > qcom,q6adm.h
        cd -
        
        echo ""
        echo "✅ Download complete!"

    # ============================================
    # VERIFY
    # ============================================
    - name: 📂 Verify downloaded files
      run: |
        echo "📂 Verifying downloaded files..."
        echo "================================"
        
        DTS_DIR="target/linux/msm89xx/dts-6.18"
        
        if [ -d "$DTS_DIR" ]; then
          echo "✅ DTS directory exists!"
          echo ""
          echo "📁 DTS files:"
          ls -la "$DTS_DIR/arch/arm64/boot/dts/qcom/"
          
          echo ""
          echo "📁 DT bindings:"
          ls -la "$DTS_DIR/include/dt-bindings/"
          
          echo ""
          echo "📁 Sound bindings:"
          ls -la "$DTS_DIR/include/dt-bindings/sound/"
        else
          echo "❌ DTS directory not found!"
          exit 1
        fi

    # ============================================
    # CHECK DTS CONTENT
    # ============================================
    - name: 🔍 Check DTS content
      run: |
        echo "🔍 Checking DTS content..."
        
        DTS_FILE="target/linux/msm89xx/dts-6.18/arch/arm64/boot/dts/qcom/msm8916-samsung-j5.dts"
        
        if [ -f "$DTS_FILE" ]; then
          echo "✅ DTS file exists!"
          echo ""
          echo "📋 File size:"
          ls -lh "$DTS_FILE"
          
          echo ""
          echo "📋 Includes:"
          grep "^#include" "$DTS_FILE" || echo "No includes found"
        else
          echo "❌ DTS file not found!"
          exit 1
        fi

    # ============================================
    # COMMIT & PUSH
    # ============================================
    - name: 📝 Commit & Push
      run: |
        echo "📝 Committing DTS files..."
        
        # Configure git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # Add files
        git add target/linux/msm89xx/dts-6.18/
        
        # Check if there are changes
        if git diff --staged --quiet; then
          echo "✅ No changes to commit"
        else
          echo "📝 Changes detected, committing..."
          git commit -m "Add DTS for Samsung J5 (MSM8916)
          
          - msm8916-samsung-j5.dts
          - msm8916-samsung-j5-common.dtsi
          - dt-bindings includes
          
          Source: https://github.com/torvalds/linux"
          
          echo ""
          echo "📤 Pushing to repository..."
          git push origin HEAD:${{ github.ref_name }}
          
          echo "✅ Successfully pushed!"
        fi

    # ============================================
    # UPLOAD ARTIFACT (Backup)
    # ============================================
    - name: 📤 Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: samsung-j5-dts
        path: target/linux/msm89xx/dts-6.18/
        retention-days: 30
