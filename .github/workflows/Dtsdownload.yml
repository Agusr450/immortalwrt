name: 📥 Download & Extract DTS untuk Samsung J5

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  download-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: ⚙️ Setup
      run: |
        sudo apt-get update -y
        sudo apt-get install -y wget

    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    # ============================================
    # DOWNLOAD & EKSTRAK DTS
    # ============================================
    - name: 📄 Download & Extract DTS
      run: |
        echo "📥 Downloading DTS files for Samsung J5..."
        
        # Buat direktori DTS
        DTS_DIR="target/linux/msm89xx/dts-6.18/arch/arm64/boot/dts/qcom"
        mkdir -p "$DTS_DIR"
        
        DT_BINDINGS_DIR="target/linux/msm89xx/dts-6.18/include/dt-bindings"
        mkdir -p "$DT_BINDINGS_DIR"
        
        # ==========================================
        # 1. DOWNLOAD DTS FILE
        # ==========================================
        echo ""
        echo "📥 Downloading DTS files..."
        
        # Main DTS
        echo "Downloading msm8916-samsung-j5.dts..."
        wget -q -O "$DTS_DIR/msm8916-samsung-j5.dts" \
          https://raw.githubusercontent.com/torvalds/linux/master/arch/arm64/boot/dts/qcom/msm8916-samsung-j5.dts
        
        # Common DTSI
        echo "Downloading msm8916-samsung-j5-common.dtsi..."
        wget -q -O "$DTS_DIR/msm8916-samsung-j5-common.dtsi" \
          https://raw.githubusercontent.com/torvalds/linux/master/arch/arm64/boot/dts/qcom/msm8916-samsung-j5-common.dtsi
        
        # ==========================================
        # 2. DOWNLOAD DT BINDINGS
        # ==========================================
        echo ""
        echo "📥 Downloading DT bindings..."
        
        # GPIO
        echo "Downloading gpio.h..."
        wget -q -O "$DT_BINDINGS_DIR/gpio.h" \
          https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/gpio/gpio.h
        
        # Clock
        echo "Downloading clock.h..."
        wget -q -O "$DT_BINDINGS_DIR/clock.h" \
          https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/clock/qcom,gcc-msm8916.h
        
        # RPM Clock
        echo "Downloading rpmcc.h..."
        wget -q -O "$DT_BINDINGS_DIR/rpmcc.h" \
          https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/clock/qcom,rpmcc.h
        
        # Interrupt
        echo "Downloading interrupt.h..."
        wget -q -O "$DT_BINDINGS_DIR/interrupt.h" \
          https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/interrupt-controller/irq.h
        
        # Power
        echo "Downloading power.h..."
        wget -q -O "$DT_BINDINGS_DIR/power.h" \
          https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/power/qcom-rpmpd.h
        
        # ==========================================
        # 3. DOWNLOAD SOUND BINDINGS
        # ==========================================
        echo ""
        echo "📥 Downloading sound bindings..."
        
        mkdir -p "$DT_BINDINGS_DIR/sound"
        
        # Download or create dummy files
        echo "Downloading qcom,q6afe.h..."
        wget -q -O "$DT_BINDINGS_DIR/sound/qcom,q6afe.h" \
          https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/sound/qcom,q6afe.h || echo "/* dummy */" > "$DT_BINDINGS_DIR/sound/qcom,q6afe.h"
        
        echo "Downloading qcom,q6asm.h..."
        wget -q -O "$DT_BINDINGS_DIR/sound/qcom,q6asm.h" \
          https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/sound/qcom,q6asm.h || echo "/* dummy */" > "$DT_BINDINGS_DIR/sound/qcom,q6asm.h"
        
        echo "Creating dummy qcom,q6adm.h..."
        echo "/* dummy for qcom,q6adm.h */" > "$DT_BINDINGS_DIR/sound/qcom,q6adm.h"
        
        echo ""
        echo "✅ Download complete!"

    # ============================================
    # VERIFY FILES
    # ============================================
    - name: 📂 Verify downloaded files
      run: |
        echo "📂 Verifying downloaded files..."
        echo "================================"
        
        DTS_DIR="target/linux/msm89xx/dts-6.18/arch/arm64/boot/dts/qcom"
        DT_BINDINGS_DIR="target/linux/msm89xx/dts-6.18/include/dt-bindings"
        
        echo ""
        echo "📁 DTS files:"
        ls -la "$DTS_DIR/" 2>/dev/null || echo "Directory not found"
        
        echo ""
        echo "📁 DT Bindings:"
        ls -la "$DT_BINDINGS_DIR/" 2>/dev/null | grep -E "\.h$" || echo "No header files"
        
        echo ""
        echo "📁 Sound bindings:"
        ls -la "$DT_BINDINGS_DIR/sound/" 2>/dev/null || echo "No sound directory"

    # ============================================
    # CHECK DTS CONTENT
    # ============================================
    - name: 🔍 Check DTS content
      run: |
        echo "🔍 Checking DTS content..."
        
        DTS_FILE="target/linux/msm89xx/dts-6.18/arch/arm64/boot/dts/qcom/msm8916-samsung-j5.dts"
        
        if [ -f "$DTS_FILE" ]; then
          echo "✅ DTS file exists!"
          echo ""
          echo "📋 File size:"
          ls -lh "$DTS_FILE"
          
          echo ""
          echo "📋 DTS content (first 20 lines):"
          head -20 "$DTS_FILE"
          
          echo ""
          echo "📋 Includes:"
          grep "^#include" "$DTS_FILE" || echo "No includes found"
        else
          echo "❌ DTS file not found!"
          exit 1
        fi

    # ============================================
    # COPY TO KERNEL BUILD DIR
    # ============================================
    - name: 📥 Copy to kernel build directory
      run: |
        echo "📥 Copying DTS to kernel build directory..."
        
        KERNEL_DTS_DIR="build_dir/target-aarch64_generic_musl/linux-msm89xx_msm8916/linux-6.18.35/arch/arm64/boot/dts/qcom"
        mkdir -p "$KERNEL_DTS_DIR"
        
        # Copy DTS files
        cp -r target/linux/msm89xx/dts-6.18/arch/arm64/boot/dts/qcom/* "$KERNEL_DTS_DIR/" 2>/dev/null || true
        
        # Copy includes
        KERNEL_INCLUDE_DIR="build_dir/target-aarch64_generic_musl/linux-msm89xx_msm8916/linux-6.18.35/include/dt-bindings"
        mkdir -p "$KERNEL_INCLUDE_DIR"
        cp -r target/linux/msm89xx/dts-6.18/include/dt-bindings/* "$KERNEL_INCLUDE_DIR/" 2>/dev/null || true
        
        echo "✅ Files copied to kernel build directory"
        ls -la "$KERNEL_DTS_DIR/" 2>/dev/null || echo "Directory not found"

    # ============================================
    # UPLOAD ARTIFACT
    # ============================================
    - name: 📤 Upload DTS files
      uses: actions/upload-artifact@v4
      with:
        name: samsung-j5-dts
        path: |
          target/linux/msm89xx/dts-6.18/
          .config
        retention-days: 30

    # ============================================
    # CREATE RELEASE
    # ============================================
    - name: 🚀 Create Release
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        tag_name: samsung-j5-dts
        name: 📦 Samsung J5 DTS Files
        body: |
          ## 📄 Device Tree Source untuk Samsung J5 (MSM8916)
          
          ### 📁 Isi:
          - `msm8916-samsung-j5.dts` - Main DTS
          - `msm8916-samsung-j5-common.dtsi` - Common includes
          - `dt-bindings/` - Required header files
          
          ### 📂 Lokasi:
          ```
          target/linux/msm89xx/dts-6.18/
          ```
          
          ### 🚀 Next Step:
          Jalankan build firmware:
          ```bash
          make -j$(nproc) V=s
          ```
        files: |
          target/linux/msm89xx/dts-6.18/
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
