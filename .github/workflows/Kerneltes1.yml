name: 🔨 Build Kernel + DTB for Samsung J5

on:
  workflow_dispatch:
    inputs:
      clean:
        description: '🧹 Clean build?'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
    # ============================================
    # 1. SETUP
    # ============================================
    - name: ⚙️ Setup
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          build-essential flex bison g++ gawk \
          git libncurses-dev libssl-dev python3 \
          rsync unzip zlib1g-dev file wget time \
          cpio xxd bc lzma lzop perl libelf-dev \
          device-tree-compiler u-boot-tools

    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🔄 Update feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ============================================
    # 2. CACHE
    # ============================================
    - name: 💾 Cache toolchain
      uses: actions/cache@v4
      with:
        path: |
          staging_dir/toolchain-aarch64_generic_gcc-*
          staging_dir/host
          staging_dir/hostpkg
          staging_dir/target-aarch64_generic_musl
          build_dir/target-aarch64_generic_musl
          build_dir/host
        key: kernel-build-${{ github.sha }}
        restore-keys: |
          kernel-build-
          toolchain-
          staging-

    - name: 💾 Cache download
      uses: actions/cache@v4
      with:
        path: dl
        key: dl-${{ hashFiles('feeds.conf.default') }}
        restore-keys: |
          dl-

    # ============================================
    # 3. DOWNLOAD KERNEL SOURCE
    # ============================================
    - name: 📥 Download kernel source
      run: |
        echo "📥 Downloading kernel source..."
        
        # Download kernel
        make -j4 target/linux/download V=s || true
        
        # Create kernel build directory
        KERNEL_BUILD_DIR="build_dir/target-aarch64_generic_musl/linux-msm89xx_msm8916"
        mkdir -p "$KERNEL_BUILD_DIR"
        
        KERNEL_DIR="$KERNEL_BUILD_DIR/linux-6.18.35"
        
        # Extract kernel if not exists
        if [ ! -d "$KERNEL_DIR" ]; then
          echo "📦 Extracting kernel..."
          KERNEL_TAR=$(find dl -name "linux-*.tar.xz" | head -1)
          if [ -f "$KERNEL_TAR" ]; then
            tar -xf "$KERNEL_TAR" -C "$KERNEL_BUILD_DIR/"
            echo "✅ Kernel extracted to: $KERNEL_DIR"
          else
            echo "❌ Kernel tarball not found!"
            ls -la dl/ | grep linux
            exit 1
          fi
        else
          echo "✅ Kernel already exists: $KERNEL_DIR"
        fi

    # ============================================
    # 4. COPY DTS TO KERNEL
    # ============================================
    - name: 📄 Copy DTS to kernel
      run: |
        echo "📄 Copying DTS to kernel source..."
        
        KERNEL_DIR="build_dir/target-aarch64_generic_musl/linux-msm89xx_msm8916/linux-6.18.35"
        
        if [ ! -d "$KERNEL_DIR" ]; then
          echo "❌ Kernel directory not found!"
          exit 1
        fi
        
        # Copy DTS from target/linux to kernel
        DTS_SRC="target/linux/msm89xx/dts-6.18/arch/arm64/boot/dts/qcom"
        DTS_DST="$KERNEL_DIR/arch/arm64/boot/dts/qcom"
        
        if [ -d "$DTS_SRC" ]; then
          mkdir -p "$DTS_DST"
          cp -v "$DTS_SRC"/*.dts* "$DTS_DST/" 2>/dev/null || true
          echo "✅ DTS copied to kernel"
        else
          echo "⚠️ DTS source not found, downloading..."
          mkdir -p "$DTS_DST"
          cd "$DTS_DST"
          wget -q https://raw.githubusercontent.com/torvalds/linux/master/arch/arm64/boot/dts/qcom/msm8916-samsung-j5.dts
          wget -q https://raw.githubusercontent.com/torvalds/linux/master/arch/arm64/boot/dts/qcom/msm8916-samsung-j5-common.dtsi
          cd -
        fi
        
        # Copy includes
        INCLUDE_SRC="target/linux/msm89xx/dts-6.18/include/dt-bindings"
        INCLUDE_DST="$KERNEL_DIR/include/dt-bindings"
        
        if [ -d "$INCLUDE_SRC" ]; then
          mkdir -p "$INCLUDE_DST"
          cp -r "$INCLUDE_SRC"/* "$INCLUDE_DST/" 2>/dev/null || true
        else
          mkdir -p "$INCLUDE_DST"
          cd "$INCLUDE_DST"
          wget -q https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/gpio/gpio.h
          wget -q https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/clock/qcom,gcc-msm8916.h
          wget -q https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/clock/qcom,rpmcc.h
          wget -q https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/interrupt-controller/irq.h
          wget -q https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/power/qcom-rpmpd.h
          cd -
        fi
        
        echo "📂 DTS files in kernel:"
        ls -la "$DTS_DST/" | grep samsung

    # ============================================
    # 5. PATCH KERNEL MAKEFILE
    # ============================================
    - name: 📄 Patch kernel Makefile
      run: |
        KERNEL_DIR="build_dir/target-aarch64_generic_musl/linux-msm89xx_msm8916/linux-6.18.35"
        MAKE_FILE="$KERNEL_DIR/arch/arm64/boot/dts/qcom/Makefile"
        
        echo "🔧 Patching $MAKE_FILE..."
        
        if [ -f "$MAKE_FILE" ]; then
          if ! grep -q "msm8916-samsung-j5" "$MAKE_FILE"; then
            echo "Adding DTS to Makefile..."
            sed -i '/dtb-$(CONFIG_ARCH_QCOM) +=/a \	msm8916-samsung-j5.dtb \\' "$MAKE_FILE"
          fi
        else
          echo "Creating Makefile..."
          cat > "$MAKE_FILE" << 'EOF'
          # SPDX-License-Identifier: GPL-2.0
          dtb-$(CONFIG_ARCH_QCOM) += msm8916-samsung-j5.dtb
          EOF
        fi
        
        echo "✅ Makefile:"
        cat "$MAKE_FILE"

    # ============================================
    # 6. GENERATE CONFIG
    # ============================================
    - name: ⚙️ Generate config
      run: |
        echo "🔧 Generating config..."
        
        cat > .config << 'EOF'
        # Target
        CONFIG_TARGET_msm89xx=y
        CONFIG_TARGET_msm89xx_msm8916=y
        CONFIG_TARGET_msm89xx_msm8916_DEVICE_samsung-j5=y
        
        # Kernel options
        CONFIG_KERNEL_DEVICETREE=y
        CONFIG_KERNEL_DTBS="msm8916-samsung-j5.dtb"
        CONFIG_KERNEL_FIT_IMAGE=y
        CONFIG_KERNEL_FIT_SIGNATURE=n
        
        # Debug
        CONFIG_KERNEL_DEBUG_INFO=y
        CONFIG_KERNEL_DEBUG_KERNEL=y
        
        # Minimal
        CONFIG_TARGET_IMAGES_ITB=y
        CONFIG_TARGET_ROOTFS_SQUASHFS=y
        CONFIG_PACKAGE_busybox=y
        
        # Build options
        CONFIG_USE_SSTRIP=y
        CONFIG_STRIP_ALL=y
        EOF
        
        make defconfig
        
        echo "✅ Config:"
        grep "CONFIG_TARGET" .config | grep -v "is not set"
        grep "CONFIG_KERNEL" .config | grep -v "is not set"

    # ============================================
    # 7. BUILD KERNEL
    # ============================================
    - name: 🔨 Build kernel
      run: |
        echo "🚀 Building kernel..."
        echo "========================================"
        
        CORES=$(nproc)
        echo "Using $CORES cores"
        
        # Clean if requested
        if [ "${{ github.event.inputs.clean }}" = "yes" ]; then
          echo "🧹 Clean build requested"
          make clean
          rm -rf build_dir/target-aarch64_generic_musl
          rm -rf staging_dir/target-aarch64_generic_musl
        fi
        
        # Build kernel
        make -j$CORES target/linux/compile V=s 2>&1 | tee kernel-build.log
        
        echo "✅ Kernel build completed"

    # ============================================
    # 8. VERIFY KERNEL OUTPUT
    # ============================================
    - name: 📂 Verify kernel output
      if: always()
      run: |
        echo "📂 Verifying kernel build output..."
        echo "========================================"
        
        KERNEL_DIR="build_dir/target-aarch64_generic_musl/linux-msm89xx_msm8916/linux-6.18.35"
        
        # Check Image
        echo "📦 Checking Image:"
        if [ -f "$KERNEL_DIR/arch/arm64/boot/Image" ]; then
          ls -lh "$KERNEL_DIR/arch/arm64/boot/Image"
        else
          echo "❌ Image not found!"
          find "$KERNEL_DIR" -name "Image" 2>/dev/null || echo "No Image found"
        fi
        
        # Check DTB
        echo ""
        echo "📦 Checking DTB:"
        DTB_FILE="$KERNEL_DIR/arch/arm64/boot/dts/qcom/msm8916-samsung-j5.dtb"
        if [ -f "$DTB_FILE" ]; then
          ls -lh "$DTB_FILE"
        else
          echo "❌ DTB not found!"
          echo "Searching for any DTB:"
          find "$KERNEL_DIR" -name "*.dtb" 2>/dev/null | head -10
        fi
        
        # Check kernel log for errors
        echo ""
        echo "📋 Build errors:"
        if [ -f "kernel-build.log" ]; then
          grep -E "(error|Error|ERROR)" kernel-build.log | head -10 || echo "No errors found"
        fi

    # ============================================
    # 9. BUILD DTB MANUALLY (if needed)
    # ============================================
    - name: 🔧 Manual DTB build
      if: failure()
      run: |
        echo "🔧 Trying to build DTB manually..."
        
        KERNEL_DIR="build_dir/target-aarch64_generic_musl/linux-msm89xx_msm8916/linux-6.18.35"
        
        if [ ! -d "$KERNEL_DIR" ]; then
          echo "❌ Kernel directory not found!"
          exit 1
        fi
        
        DTS_FILE="$KERNEL_DIR/arch/arm64/boot/dts/qcom/msm8916-samsung-j5.dts"
        DTB_FILE="$KERNEL_DIR/arch/arm64/boot/dts/qcom/msm8916-samsung-j5.dtb"
        
        if [ ! -f "$DTS_FILE" ]; then
          echo "❌ DTS file not found!"
          exit 1
        fi
        
        echo "📄 Compiling DTB manually..."
        cd "$KERNEL_DIR"
        
        dtc -I dts -O dtb \
          -i "include/dt-bindings" \
          -i "arch/arm64/boot/dts/qcom" \
          -o "$DTB_FILE" \
          "$DTS_FILE" 2>&1 | tee dtc-build.log
        
        if [ -f "$DTB_FILE" ]; then
          echo "✅ Manual DTB build succeeded!"
          ls -lh "$DTB_FILE"
        else
          echo "❌ Manual DTB build failed"
          cat dtc-build.log
        fi

    # ============================================
    # 10. COPY OUTPUT
    # ============================================
    - name: 📦 Copy output
      if: success()
      run: |
        echo "📦 Copying kernel output..."
        
        KERNEL_DIR="build_dir/target-aarch64_generic_musl/linux-msm89xx_msm8916/linux-6.18.35"
        OUTPUT_DIR="kernel-output"
        mkdir -p "$OUTPUT_DIR"
        
        # Copy Image
        if [ -f "$KERNEL_DIR/arch/arm64/boot/Image" ]; then
          cp "$KERNEL_DIR/arch/arm64/boot/Image" "$OUTPUT_DIR/"
          echo "✅ Image copied"
        fi
        
        # Copy DTB
        if [ -f "$KERNEL_DIR/arch/arm64/boot/dts/qcom/msm8916-samsung-j5.dtb" ]; then
          cp "$KERNEL_DIR/arch/arm64/boot/dts/qcom/msm8916-samsung-j5.dtb" "$OUTPUT_DIR/"
          echo "✅ DTB copied"
        fi
        
        # Copy DTS
        cp "$KERNEL_DIR/arch/arm64/boot/dts/qcom/msm8916-samsung-j5.dts" "$OUTPUT_DIR/" 2>/dev/null || true
        cp "$KERNEL_DIR/arch/arm64/boot/dts/qcom/msm8916-samsung-j5-common.dtsi" "$OUTPUT_DIR/" 2>/dev/null || true
        
        # Copy logs
        cp *.log "$OUTPUT_DIR/" 2>/dev/null || true
        
        echo "📂 Output:"
        ls -lah "$OUTPUT_DIR/"

    # ============================================
    # 11. UPLOAD
    # ============================================
    - name: 📤 Upload kernel output
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-j5-${{ github.run_number }}
        path: |
          kernel-output/
          .config
        retention-days: 7

    - name: 📤 Upload logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-logs-${{ github.run_number }}
        path: |
          *.log
          logs/
        retention-days: 7
