name: 🚀 Build ImmortalWrt untuk Samsung J5 (MSM8916) - Super Fast

on:
  workflow_dispatch:
    inputs:
      wifi_ssid:
        description: '📶 WiFi SSID'
        required: true
        default: 'J5-WiFi'
      wifi_password:
        description: '🔑 WiFi Password (min 8 chars)'
        required: true
        default: '12345678'
      apn:
        description: '📡 APN untuk 4G/LTE'
        required: true
        default: 'internet'
      clean_build:
        description: '🧹 Clean build (ya/tidak)'
        required: false
        default: 'tidak'
        type: choice
        options:
          - 'tidak'
          - 'ya'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
    # ============================================
    # 1. SETUP LINGKUNGAN & CCACHE
    # ============================================
    - name: ⚙️ Setup Build Environment + ccache
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          build-essential flex bison g++ gawk gcc-multilib g++-multilib \
          git libncurses-dev libssl-dev python3 python3-dev python3-pip \
          rsync unzip zlib1g-dev file wget time cpio xxd bc lzma lzop \
          perl libelf-dev device-tree-compiler u-boot-tools ccache
        
        sudo ln -sf /usr/bin/python3 /usr/bin/python
        pip3 install --upgrade pip setuptools wheel
        
        # Setup ccache
        mkdir -p ~/.ccache
        cat > ~/.ccache/ccache.conf << 'EOF'
        max_size = 10.0G
        compression = true
        compression_level = 6
        cache_dir = /home/runner/.ccache
        sloppiness = file_macro,include_file_mtime,time_macros
        EOF
        
        # Set environment variables
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
        echo "CCACHE_COMPRESSLEVEL=6" >> $GITHUB_ENV
        echo "CCACHE_SLOPPINESS=file_macro,include_file_mtime,time_macros" >> $GITHUB_ENV
        echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV
        
        echo "✅ Build environment + ccache siap!"
        ccache --version
        ccache -s

    # ============================================
    # 2. CACHE GITHUB (MAXIMUM CACHE)
    # ============================================
    - name: 💾 Cache Toolchain & Build
      uses: actions/cache@v4
      with:
        path: |
          staging_dir/toolchain-aarch64_generic_gcc-*
          staging_dir/host
          staging_dir/hostpkg
          staging_dir/target-aarch64_generic_musl
          build_dir/target-aarch64_generic_musl
          build_dir/host
        key: build-${{ github.sha }}
        restore-keys: |
          build-
          toolchain-
          staging-
          host-

    - name: 💾 Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ github.sha }}
        restore-keys: |
          ccache-

    - name: 💾 Cache Download
      uses: actions/cache@v4
      with:
        path: dl
        key: dl-${{ hashFiles('feeds.conf.default') }}-${{ hashFiles('feeds.conf') }}
        restore-keys: |
          dl-
          dl-main-

    - name: 💾 Cache Feeds
      uses: actions/cache@v4
      with:
        path: feeds
        key: feeds-${{ hashFiles('feeds.conf.default') }}-${{ hashFiles('feeds.conf') }}
        restore-keys: |
          feeds-

    - name: 💾 Cache Kernel
      uses: actions/cache@v4
      with:
        path: |
          build_dir/target-aarch64_generic_musl/linux-msm89xx_msm8916/linux-*
          build_dir/target-aarch64_generic_musl/linux-msm89xx_msm8916/.config
        key: kernel-${{ hashFiles('target/linux/msm89xx/config-*') }}
        restore-keys: |
          kernel-

    # ============================================
    # 3. CHECKOUT & UPDATE
    # ============================================
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🔄 Update feeds (with cache)
      run: |
        # Check if feeds already cached
        if [ -f feeds/.feeds_done ]; then
          echo "📦 Using cached feeds"
          ./scripts/feeds update -i
          ./scripts/feeds install -i
        else
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          mkdir -p feeds
          touch feeds/.feeds_done
        fi

    # ============================================
    # 4. TAMBAHKAN DTS SAMSUNG J5
    # ============================================
    - name: 📄 Add Samsung J5 Device Tree
      run: |
        KERNEL_DTS_DIR="target/linux/msm89xx/dts-6.18/arch/arm64/boot/dts/qcom"
        mkdir -p "$KERNEL_DTS_DIR"
        
        # Download DTS files
        curl -s -o "$KERNEL_DTS_DIR/msm8916-samsung-j5-common.dtsi" \
          https://raw.githubusercontent.com/torvalds/linux/master/arch/arm64/boot/dts/qcom/msm8916-samsung-j5-common.dtsi
        
        curl -s -o "$KERNEL_DTS_DIR/msm8916-samsung-j5.dts" \
          https://raw.githubusercontent.com/torvalds/linux/master/arch/arm64/boot/dts/qcom/msm8916-samsung-j5.dts
        
        # Add include files
        mkdir -p "target/linux/msm89xx/dts-6.18/include/dt-bindings/"
        curl -s -o "target/linux/msm89xx/dts-6.18/include/dt-bindings/gpio.h" \
          https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/gpio/gpio.h
        curl -s -o "target/linux/msm89xx/dts-6.18/include/dt-bindings/clock.h" \
          https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/clock/qcom,gcc-msm8916.h
        
        echo "✅ DTS files added"

    # ============================================
    # 5. ADD DEVICE TO MAKEFILE
    # ============================================
    - name: 📝 Add Samsung J5 to msm8916.mk
      run: |
        mkdir -p target/linux/msm89xx/image
        
        cat > target/linux/msm89xx/image/msm8916.mk << 'EOF'
        include $(TOPDIR)/rules.mk
        
        DEVICE_VARS += DEVICE_DTS
        
        define Device/qcom-msm8916
          DEVICE_VENDOR := Qualcomm
          DEVICE_MODEL := MSM8916
          IMAGES := combined.img rootfs.img
          KERNEL_LOADADDR := 0x80008000
          KERNEL_ENTRY := 0x80008000
          BOOT_SCRIPT := boot-msm89xx
          IMAGE_SIZE := 32m
          KERNEL := kernel-bin | gzip | fit gzip
          KERNEL_INITRAMFS := kernel-bin | gzip | fit gzip
          IMAGE/combined.img := append-kernel | append-rootfs | pad-rootfs | append-metadata
          IMAGE/rootfs.img := append-rootfs
        endef
        
        define Device/samsung-j5
          $(Device/qcom-msm8916)
          DEVICE_VENDOR := Samsung
          DEVICE_MODEL := Galaxy J5
          DEVICE_DTS := qcom/msm8916-samsung-j5
          IMAGE_SIZE := 1024m
          SUPPORTED_DEVICES := samsung-j5
          DEVICE_PACKAGES := kmod-usb-net-qmi-wwan kmod-usb-serial-option \
                             kmod-usb-serial-qualcomm usbutils modemmanager \
                             kmod-usb-phy-qcom-msm dnsmasq-full
        endef
        TARGET_DEVICES += samsung-j5
        EOF
        
        echo "✅ msm8916.mk created"

    # ============================================
    # 6. CONFIG GENERATION
    # ============================================
    - name: ⚙️ Generate .config
      run: |
        cat > .config << 'EOF'
        CONFIG_TARGET_msm89xx=y
        CONFIG_TARGET_msm89xx_msm8916=y
        CONFIG_TARGET_msm89xx_msm8916_DEVICE_samsung-j5=y
        
        CONFIG_TARGET_ROOTFS_SQUASHFS=y
        CONFIG_TARGET_IMAGES_GZIP=y
        CONFIG_TARGET_IMAGES_ITB=y
        
        CONFIG_KERNEL_DEVICETREE=y
        CONFIG_KERNEL_DTBS="qcom/msm8916-samsung-j5.dtb"
        CONFIG_KERNEL_FIT_IMAGE=y
        CONFIG_KERNEL_FIT_SIGNATURE=n
        
        CONFIG_TARGET_OPTIMIZATION="-Os -pipe -fno-caller-saves -fno-plt"
        CONFIG_STRIP_KERNEL_EXPORTS=y
        CONFIG_USE_SSTRIP=y
        CONFIG_STRIP_ALL=y
        
        # 🔥 CRITICAL: Enable ccache
        CONFIG_CCACHE=y
        CONFIG_CCACHE_DIR="/home/runner/.ccache"
        
        # Optimasi build
        CONFIG_MAKE_TOOLCHAIN_PARALLEL=y
        CONFIG_MAKE_TOOLCHAIN_ARGS="-j$(nproc)"
        
        # Minimal packages untuk kecepatan
        CONFIG_PACKAGE_busybox=y
        CONFIG_PACKAGE_busybox-config-mdev=y
        CONFIG_PACKAGE_dropbear=y
        CONFIG_PACKAGE_firewall=y
        CONFIG_PACKAGE_dnsmasq-full=y
        CONFIG_PACKAGE_luci-light=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        CONFIG_PACKAGE_luci-app-firewall=y
        
        # WiFi
        CONFIG_PACKAGE_iw=y
        CONFIG_PACKAGE_iwinfo=y
        CONFIG_PACKAGE_wpad-basic=y
        CONFIG_PACKAGE_hostapd=y
        CONFIG_PACKAGE_wireless-tools=y
        
        # 4G/LTE
        CONFIG_PACKAGE_kmod-usb-core=y
        CONFIG_PACKAGE_kmod-usb-net=y
        CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
        CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
        CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
        CONFIG_PACKAGE_kmod-usb-serial=y
        CONFIG_PACKAGE_kmod-usb-serial-option=y
        CONFIG_PACKAGE_kmod-usb-serial-qualcomm=y
        CONFIG_PACKAGE_kmod-usb-serial-wwan=y
        CONFIG_PACKAGE_usbutils=y
        CONFIG_PACKAGE_kmod-usb-phy-qcom-msm=y
        
        CONFIG_PACKAGE_modemmanager=y
        CONFIG_PACKAGE_luci-proto-modemmanager=y
        CONFIG_PACKAGE_mobile-broadband-provider-info=y
        CONFIG_PACKAGE_libmbim=y
        CONFIG_PACKAGE_libqmi=y
        CONFIG_PACKAGE_umbim=y
        CONFIG_PACKAGE_uqmi=y
        
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_wget=y
        CONFIG_PACKAGE_ip-full=y
        
        CONFIG_BUSYBOX_DEFAULT_FEATURE_EXTRA_QUIET=y
        CONFIG_BUSYBOX_DEFAULT_FEATURE_SYSLOG=y
        EOF
        
        make defconfig
        
        echo "📋 VERIFIKASI CCACHE:"
        grep CONFIG_CCACHE .config || echo "⚠️ CCACHE TIDAK AKTIF!"
        
        echo "📋 DEVICE TARGET:"
        grep "samsung-j5" .config | grep -v "is not set" || echo "⚠️ TARGET TIDAK DITEMUKAN!"

    # ============================================
    # 7. DOWNLOAD SUMBER (PARALLEL)
    # ============================================
    - name: 📥 Download sources (MAXIMUM PARALLEL)
      run: |
        # Detect maximum cores
        CORES=$(nproc)
        echo "🖥️ Using $CORES cores for download"
        
        # Download with maximum parallelism
        echo "📥 Phase 1: Parallel download with $CORES threads"
        make download -j$CORES V=s || true
        
        # Retry failed downloads
        echo "📥 Phase 2: Retry failed downloads"
        make download -j$CORES V=s || true
        
        # Final attempt with single thread for stubborn files
        echo "📥 Phase 3: Final attempt (single thread)"
        make download -j1 V=s || true
        
        # Show ccache stats before build
        echo "📊 CCACHE STATS (BEFORE BUILD):"
        ccache -s

    # ============================================
    # 8. BUILD FIRMWARE (MAXIMUM PARALLEL)
    # ============================================
    - name: 🔨 Build firmware (MAXIMUM SPEED)
      run: |
        CORES=$(nproc)
        echo "🚀 Building with $CORES cores"
        
        # Show ccache stats before build
        echo "📊 CCACHE BEFORE BUILD:"
        ccache -s
        
        # Check if clean build requested
        if [ "${{ github.event.inputs.clean_build }}" = "ya" ]; then
          echo "🧹 Clean build requested"
          make clean
          rm -rf build_dir/target-aarch64_generic_musl
          rm -rf staging_dir/target-aarch64_generic_musl
        fi
        
        # Build with maximum parallelism
        echo "🔨 Phase 1: Building toolchain (parallel)"
        make -j$CORES toolchain/compile V=s || true
        
        echo "🔨 Phase 2: Building target (parallel)"
        make -j$CORES target/compile V=s || true
        
        echo "🔨 Phase 3: Building packages (parallel)"
        make -j$CORES package/compile V=s || true
        
        echo "🔨 Phase 4: Building image (parallel)"
        make -j$CORES target/install V=s || true
        
        echo "🔨 Phase 5: Final build (with retry)"
        make -j$CORES V=s || make -j1 V=s
        
        # Show ccache stats after build
        echo "📊 CCACHE STATS (AFTER BUILD):"
        ccache -s
        
        echo "✅ Build completed!"

    # ============================================
    # 9. LIST & UPLOAD RESULTS
    # ============================================
    - name: 📂 List build output
      if: always()
      run: |
        echo "📂 FINDING BUILD ARTIFACTS"
        echo "=============================="
        
        # Find all firmware files
        find bin/targets/ -type f \( -name "*.img" -o -name "*.itb" -o -name "*.dtb" -o -name "*.bin" -o -name "*.tar" -o -name "*.gz" \) 2>/dev/null | while read file; do
          size=$(du -h "$file" | cut -f1)
          echo "📦 $file ($size)"
        done
        
        if [ ! -d "bin/targets/msm89xx/msm8916" ]; then
          echo "⚠️ WARNING: Build may have failed, no output directory found!"
          echo "📂 Available build directories:"
          find bin/targets/ -type d 2>/dev/null || echo "No directories found"
        fi

    - name: 📤 Upload firmware
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: immortalwrt-j5-msm8916-${{ github.run_number }}
        path: |
          bin/targets/msm89xx/msm8916/*.img
          bin/targets/msm89xx/msm8916/*.itb
          bin/targets/msm89xx/msm8916/*.dtb
          bin/targets/msm89xx/msm8916/*.manifest
          .config
        retention-days: 7

    - name: 📤 Upload ccache stats
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ccache-stats-${{ github.run_number }}
        path: ~/.ccache/stats
        retention-days: 1

    - name: 📤 Upload logs (if failed)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ github.run_number }}
        path: |
          logs/
          .config
          build_dir/.*/.*/.*.log
        retention-days: 7

    # ============================================
    # 10. CREATE RELEASE
    # ============================================
    - name: 🚀 Create Release
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        tag_name: j5-msm8916-${{ github.run_number }}
        name: 📦 ImmortalWrt J5 MSM8916 #${{ github.run_number }}
        body: |
          📱 **ImmortalWrt untuk Samsung J5 (MSM8916)**
          
          ## 📋 Konfigurasi:
          - **WiFi SSID:** ${{ github.event.inputs.wifi_ssid }}
          - **WiFi Password:** ${{ github.event.inputs.wifi_password }}
          - **APN:** ${{ github.event.inputs.apn }}
          - **IP Address:** 192.168.1.1
          
          ## 🚀 Fitur:
          - ✅ WiFi 2.4GHz
          - ✅ 4G/LTE Modem
          - ✅ LuCI Web Interface
          - ✅ USB Gadget (RNDIS)
          - ✅ Fast Boot
          
          ## 📦 Flashing:
          ```bash
          # Boot dari fastboot
          fastboot flash boot openwrt-*.itb
          fastboot flash rootfs openwrt-*.img
          fastboot reboot
          ```
          
          ## ⚠️ Peringatan:
          - Gunakan dengan risiko sendiri
          - Pastikan backup data penting
          - Jangan putus saat flashing
          
          ## 📊 Build Stats:
          - Build Number: #${{ github.run_number }}
          - Commit: ${{ github.sha }}
          - Upload: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          ---
          *Built with ❤️ using GitHub Actions*
        files: |
          bin/targets/msm89xx/msm8916/*.img
          bin/targets/msm89xx/msm8916/*.itb
          bin/targets/msm89xx/msm8916/*.dtb
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
