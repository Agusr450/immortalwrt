name: 🚀 Build ImmortalWrt Samsung J5 (MSM8916) - Optimized

on:
  workflow_dispatch:
    inputs:
      wifi_ssid:
        description: '📶 WiFi SSID'
        required: true
        default: 'J5-WiFi'
      wifi_password:
        description: '🔑 WiFi Password (min 8 chars)'
        required: true
        default: '12345678'
      apn:
        description: '📡 APN untuk 4G/LTE'
        required: true
        default: 'internet'
      clean_build:
        description: '🧹 Clean Build?'
        required: false
        default: 'tidak'
        type: choice
        options:
          - 'tidak'
          - 'ya'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
    # ============================================
    # 1. SETUP ENVIRONMENT + CCACHE
    # ============================================
    - name: ⚙️ Setup Build Environment
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          build-essential flex bison g++ gawk gcc-multilib g++-multilib \
          git libncurses-dev libssl-dev python3 python3-dev python3-pip \
          rsync unzip zlib1g-dev file wget time cpio xxd bc lzma lzop \
          perl libelf-dev device-tree-compiler u-boot-tools ccache
        
        sudo ln -sf /usr/bin/python3 /usr/bin/python
        pip3 install --upgrade pip setuptools wheel
        
        # Setup ccache
        mkdir -p ~/.ccache
        cat > ~/.ccache/ccache.conf << 'EOF'
        max_size = 10.0G
        compression = true
        compression_level = 6
        cache_dir = /home/runner/.ccache
        sloppiness = file_macro,include_file_mtime,time_macros
        EOF
        
        # Environment variables
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
        echo "CCACHE_COMPRESSLEVEL=6" >> $GITHUB_ENV
        echo "CCACHE_SLOPPINESS=file_macro,include_file_mtime,time_macros" >> $GITHUB_ENV
        echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV
        
        echo "✅ Environment + ccache ready!"
        ccache --version
        ccache -s

    - name: 💾 Add swap space
      run: |
        free -h
        if ! swapon --show | grep -q "/swapfile"; then
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
        fi
        free -h

    # ============================================
    # 2. GITHUB CACHE (MAXIMUM)
    # ============================================
    - name: 💾 Cache Toolchain
      uses: actions/cache@v4
      with:
        path: |
          staging_dir/toolchain-aarch64_generic_gcc-*
          staging_dir/host
          staging_dir/hostpkg
          staging_dir/target-aarch64_generic_musl
          build_dir/target-aarch64_generic_musl
          build_dir/host
        key: build-${{ github.sha }}
        restore-keys: |
          build-
          toolchain-
          staging-
          host-

    - name: 💾 Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ github.sha }}
        restore-keys: |
          ccache-

    - name: 💾 Cache Download
      uses: actions/cache@v4
      with:
        path: dl
        key: dl-${{ hashFiles('feeds.conf.default') }}
        restore-keys: |
          dl-

    - name: 💾 Cache Feeds
      uses: actions/cache@v4
      with:
        path: feeds
        key: feeds-${{ hashFiles('feeds.conf.default') }}
        restore-keys: |
          feeds-

    # ============================================
    # 3. CHECKOUT & UPDATE
    # ============================================
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🔄 Update feeds
      run: |
        if [ -f feeds/.feeds_done ]; then
          echo "📦 Using cached feeds"
          ./scripts/feeds update -i
          ./scripts/feeds install -i
        else
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          mkdir -p feeds
          touch feeds/.feeds_done
        fi

    # ============================================
    # 4. FIX DTS - SAMSUNG J5
    # ============================================
    - name: 📄 Fix Samsung J5 Device Tree
      run: |
        echo "🔧 Fixing DTS for Samsung J5..."
        
        # Create kernel DTS directory
        KERNEL_DTS_DIR="build_dir/target-aarch64_generic_musl/linux-msm89xx_msm8916/linux-6.18.35/arch/arm64/boot/dts/qcom"
        mkdir -p "$KERNEL_DTS_DIR"
        
        # Download DTS files directly to kernel build dir
        cd "$KERNEL_DTS_DIR"
        wget -q https://raw.githubusercontent.com/torvalds/linux/master/arch/arm64/boot/dts/qcom/msm8916-samsung-j5-common.dtsi
        wget -q https://raw.githubusercontent.com/torvalds/linux/master/arch/arm64/boot/dts/qcom/msm8916-samsung-j5.dts
        cd -
        
        # Download required includes
        mkdir -p "build_dir/target-aarch64_generic_musl/linux-msm89xx_msm8916/linux-6.18.35/include/dt-bindings/"
        wget -q -O "build_dir/target-aarch64_generic_musl/linux-msm89xx_msm8916/linux-6.18.35/include/dt-bindings/gpio.h" \
          https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/gpio/gpio.h
        
        wget -q -O "build_dir/target-aarch64_generic_musl/linux-msm89xx_msm8916/linux-6.18.35/include/dt-bindings/clock.h" \
          https://raw.githubusercontent.com/torvalds/linux/master/include/dt-bindings/clock/qcom,gcc-msm8916.h
        
        # Also copy to target/linux for persistence
        mkdir -p target/linux/msm89xx/files-6.18/arch/arm64/boot/dts/qcom
        cp "$KERNEL_DTS_DIR"/*.dts* target/linux/msm89xx/files-6.18/arch/arm64/boot/dts/qcom/ 2>/dev/null || true
        
        echo "✅ DTS files installed:"
        ls -la "$KERNEL_DTS_DIR/" | grep samsung || echo "⚠️ No DTS files found!"

    # ============================================
    # 5. ADD DEVICE TO MAKEFILE
    # ============================================
    - name: 📝 Add Samsung J5 device
      run: |
        mkdir -p target/linux/msm89xx/image
        
        cat > target/linux/msm89xx/image/msm8916.mk << 'EOF'
        include $(TOPDIR)/rules.mk
        
        DEVICE_VARS += DEVICE_DTS
        
        define Device/qcom-msm8916
          DEVICE_VENDOR := Qualcomm
          DEVICE_MODEL := MSM8916
          IMAGES := combined.img rootfs.img
          KERNEL_LOADADDR := 0x80008000
          KERNEL_ENTRY := 0x80008000
          BOOT_SCRIPT := boot-msm89xx
          IMAGE_SIZE := 32m
          KERNEL := kernel-bin | gzip | fit gzip
          KERNEL_INITRAMFS := kernel-bin | gzip | fit gzip
          IMAGE/combined.img := append-kernel | append-rootfs | pad-rootfs | append-metadata
          IMAGE/rootfs.img := append-rootfs
          DEVICE_DTS := msm8916-samsung-j5
        endef
        
        define Device/samsung-j5
          $(Device/qcom-msm8916)
          DEVICE_VENDOR := Samsung
          DEVICE_MODEL := Galaxy J5
          IMAGE_SIZE := 1024m
          SUPPORTED_DEVICES := samsung-j5
          DEVICE_PACKAGES := kmod-usb-net-qmi-wwan kmod-usb-serial-option \
                             kmod-usb-serial-qualcomm usbutils modemmanager \
                             kmod-usb-phy-qcom-msm dnsmasq-full \
                             kmod-ath kmod-wcn36xx
        endef
        TARGET_DEVICES += samsung-j5
        EOF
        
        echo "✅ msm8916.mk created"

    # ============================================
    # 6. GENERATE CONFIG
    # ============================================
    - name: ⚙️ Generate .config
      run: |
        cat > .config << 'EOF'
        # Target
        CONFIG_TARGET_msm89xx=y
        CONFIG_TARGET_msm89xx_msm8916=y
        CONFIG_TARGET_msm89xx_msm8916_DEVICE_samsung-j5=y
        
        # Rootfs
        CONFIG_TARGET_ROOTFS_SQUASHFS=y
        CONFIG_TARGET_IMAGES_GZIP=y
        CONFIG_TARGET_IMAGES_ITB=y
        
        # Kernel
        CONFIG_KERNEL_DEVICETREE=y
        CONFIG_KERNEL_DTBS="msm8916-samsung-j5.dtb"
        CONFIG_KERNEL_FIT_IMAGE=y
        CONFIG_KERNEL_FIT_SIGNATURE=n
        
        # Build optimizations
        CONFIG_TARGET_OPTIMIZATION="-Os -pipe -fno-caller-saves -fno-plt"
        CONFIG_STRIP_KERNEL_EXPORTS=y
        CONFIG_USE_SSTRIP=y
        CONFIG_STRIP_ALL=y
        CONFIG_CCACHE=y
        CONFIG_CCACHE_DIR="/home/runner/.ccache"
        CONFIG_MAKE_TOOLCHAIN_PARALLEL=y
        
        # Core packages
        CONFIG_PACKAGE_busybox=y
        CONFIG_PACKAGE_busybox-config-mdev=y
        CONFIG_PACKAGE_dropbear=y
        CONFIG_PACKAGE_firewall=y
        CONFIG_PACKAGE_dnsmasq-full=y
        
        # LuCI
        CONFIG_PACKAGE_luci-light=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        CONFIG_PACKAGE_luci-app-firewall=y
        CONFIG_PACKAGE_luci-app-opkg=y
        
        # WiFi
        CONFIG_PACKAGE_iw=y
        CONFIG_PACKAGE_iwinfo=y
        CONFIG_PACKAGE_wpad-basic=y
        CONFIG_PACKAGE_hostapd=y
        CONFIG_PACKAGE_wireless-tools=y
        
        # USB
        CONFIG_PACKAGE_kmod-usb-core=y
        CONFIG_PACKAGE_kmod-usb-net=y
        CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
        CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
        CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
        CONFIG_PACKAGE_kmod-usb-serial=y
        CONFIG_PACKAGE_kmod-usb-serial-option=y
        CONFIG_PACKAGE_kmod-usb-serial-qualcomm=y
        CONFIG_PACKAGE_kmod-usb-serial-wwan=y
        CONFIG_PACKAGE_usbutils=y
        CONFIG_PACKAGE_kmod-usb-phy-qcom-msm=y
        
        # Modem / 4G
        CONFIG_PACKAGE_modemmanager=y
        CONFIG_PACKAGE_luci-proto-modemmanager=y
        CONFIG_PACKAGE_mobile-broadband-provider-info=y
        CONFIG_PACKAGE_libmbim=y
        CONFIG_PACKAGE_libqmi=y
        CONFIG_PACKAGE_umbim=y
        CONFIG_PACKAGE_uqmi=y
        CONFIG_PACKAGE_wwan=y
        
        # Atheros WiFi
        CONFIG_PACKAGE_kmod-ath=y
        CONFIG_PACKAGE_kmod-wcn36xx=y
        
        # Utilities
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_wget=y
        CONFIG_PACKAGE_ip-full=y
        CONFIG_PACKAGE_e2fsprogs=y
        CONFIG_PACKAGE_mkf2fs=y
        
        # Misc
        CONFIG_BUSYBOX_DEFAULT_FEATURE_EXTRA_QUIET=y
        CONFIG_BUSYBOX_DEFAULT_FEATURE_SYSLOG=y
        EOF
        
        make defconfig
        
        echo "📋 VERIFICATION:"
        echo "------------------------"
        echo "CCACHE:"
        grep CONFIG_CCACHE .config || echo "⚠️ CCACHE NOT ENABLED!"
        echo ""
        echo "TARGET DEVICE:"
        grep "samsung-j5" .config | grep -v "is not set" || echo "⚠️ TARGET NOT FOUND!"

    # ============================================
    # 7. DOWNLOAD SOURCES
    # ============================================
    - name: 📥 Download sources
      run: |
        CORES=$(nproc)
        echo "📥 Downloading with $CORES threads..."
        
        # Download with parallel
        make download -j$CORES V=s || true
        make download -j$CORES V=s || true
        make download -j1 V=s || true
        
        echo "📊 CCACHE STATUS:"
        ccache -s

    # ============================================
    # 8. BUILD FIRMWARE
    # ============================================
    - name: 🔨 Build firmware
      run: |
        CORES=$(nproc)
        echo "🚀 Building with $CORES cores"
        echo "================================"
        
        # Show ccache stats
        echo "📊 CCACHE BEFORE BUILD:"
        ccache -s
        
        # Clean if requested
        if [ "${{ github.event.inputs.clean_build }}" = "ya" ]; then
          echo "🧹 Clean build requested"
          make clean
          rm -rf build_dir/target-aarch64_generic_musl
          rm -rf staging_dir/target-aarch64_generic_musl
        fi
        
        # Build phases
        echo "🔨 Phase 1: Toolchain"
        make -j$CORES toolchain/compile V=s || true
        
        echo "🔨 Phase 2: Target"
        make -j$CORES target/compile V=s || true
        
        echo "🔨 Phase 3: Packages"
        make -j$CORES package/compile V=s || true
        
        echo "🔨 Phase 4: Image"
        make -j$CORES target/install V=s || true
        
        echo "🔨 Phase 5: Final build"
        make -j$CORES V=s || make -j1 V=s
        
        # Show ccache stats
        echo "📊 CCACHE AFTER BUILD:"
        ccache -s
        
        echo "✅ Build completed!"

    # ============================================
    # 9. LIST OUTPUT
    # ============================================
    - name: 📂 List build output
      if: always()
      run: |
        echo "📂 BUILD OUTPUT:"
        echo "================================"
        
        # Find firmware files
        find bin/targets/ -type f \( -name "*.img" -o -name "*.itb" -o -name "*.dtb" -o -name "*.bin" \) 2>/dev/null | while read file; do
          size=$(du -h "$file" 2>/dev/null | cut -f1)
          echo "📦 $file ($size)"
        done
        
        # Check if build succeeded
        if [ -d "bin/targets/msm89xx/msm8916" ]; then
          echo ""
          echo "✅ Build SUCCESS!"
          echo "📁 Output: bin/targets/msm89xx/msm8916/"
          ls -la bin/targets/msm89xx/msm8916/ || true
        else
          echo ""
          echo "⚠️ Build may have FAILED - no output directory found"
          echo "📂 Available:"
          find bin/targets/ -type d 2>/dev/null || echo "None"
        fi

    # ============================================
    # 10. UPLOAD ARTIFACTS
    # ============================================
    - name: 📤 Upload firmware
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: immortalwrt-j5-msm8916-${{ github.run_number }}
        path: |
          bin/targets/msm89xx/msm8916/*.img
          bin/targets/msm89xx/msm8916/*.itb
          bin/targets/msm89xx/msm8916/*.dtb
          bin/targets/msm89xx/msm8916/*.manifest
          .config
        retention-days: 7

    - name: 📤 Upload logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ github.run_number }}
        path: |
          logs/
          .config
        retention-days: 7

    - name: 📤 Upload ccache stats
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ccache-stats-${{ github.run_number }}
        path: ~/.ccache/stats
        retention-days: 1

    # ============================================
    # 11. CREATE RELEASE
    # ============================================
    - name: 🚀 Create Release
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        tag_name: j5-msm8916-${{ github.run_number }}
        name: 📦 ImmortalWrt Samsung J5 MSM8916
        body: |
          ## 📱 ImmortalWrt untuk Samsung J5 (MSM8916)
          
          ### 📋 Konfigurasi:
          - **WiFi SSID:** `${{ github.event.inputs.wifi_ssid }}`
          - **WiFi Password:** `${{ github.event.inputs.wifi_password }}`
          - **APN:** `${{ github.event.inputs.apn }}`
          - **IP Address:** `192.168.1.1`
          
          ### 🚀 Fitur:
          - ✅ WiFi 2.4GHz (WCN3660)
          - ✅ 4G/LTE Modem (Qualcomm)
          - ✅ LuCI Web Interface
          - ✅ USB Gadget (RNDIS)
          - ✅ Fast Boot (U-Boot FIT)
          
          ### 📦 Cara Flashing:
          ```bash
          # Via fastboot
          fastboot flash boot openwrt-*.itb
          fastboot flash rootfs openwrt-*.img
          fastboot reboot
          
          # Via TWRP (jika tersedia)
          # Install openwrt-*.itb dan openwrt-*.img
          ```
          
          ### ⚠️ Peringatan:
          - Gunakan dengan risiko sendiri!
          - Backup data penting terlebih dahulu
          - Jangan putus saat flashing
          - Pastikan baterai > 50%
          
          ### 📊 Build Info:
          - Build Number: #${{ github.run_number }}
          - Commit: `${{ github.sha }}`
          - Run ID: ${{ github.run_id }}
          - [Build Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          ---
          *Built with ❤️ using GitHub Actions*
        files: |
          bin/targets/msm89xx/msm8916/*.img
          bin/targets/msm89xx/msm8916/*.itb
          bin/targets/msm89xx/msm8916/*.dtb
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
